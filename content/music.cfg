; MUSIC: the background tracks and the level win/loss jingles, played with GBA-style channels
; (square-wave pulses, a 4-bit "wave" bass and noise).
;
; TRACKS are two bars of 16 steps (sixteenth notes), so steps go 0-31. Tempo, volume and which
; layers play in the game track are set in the debug menu. The map and shop tracks always play
; the layers listed in their "layers" line.
;
;   roots        bass note of bar 1 and bar 2, in Hz (110 = A2, 87.3 = F2, 73.4 = D2, 65.4 = C2)
;   chords       notes the arpeggio cycles through in each bar, in semitones above the root
;   bass_steps   steps (0-15) in each bar where the bass plays
;   bass_len     how long each bass note lasts, in steps
;   bass_bounce  true = every other bass note jumps up an octave
;   pulse_every  low pulse every N steps
;   hats_every   noise hat every N steps (0 = none)
;   arp_every    arpeggio note every N steps
;   lead         melody as [step, MIDI note, length in steps]; MIDI 60 = middle C, 69 = A 440 Hz
;   layers       (map and shop only) which layers play: pulse, bass, hats, arp, lead
;
; JINGLES: notes=[frequency Hz, start sec, length sec, wave, pulse width, volume]
;   wave is "square", "wave" (4-bit bass) or "noise"; pulse width only matters for square
;   (0.125, 0.25 or 0.5 sound most GBA-like); volume 0-1, keep the total under about 1.

[game]
roots=[110.0, 87.307]
chords=[[0, 3, 7, 12], [0, 4, 7, 12]]
bass_steps=[0, 3, 6, 8, 11, 14]
bass_len=1.8
bass_bounce=false
pulse_every=4
hats_every=4
arp_every=1
lead=[[0, 76, 4], [6, 74, 2], [8, 72, 4], [14, 69, 2], [16, 72, 4], [22, 69, 2], [24, 65, 6]]

[map]
roots=[73.416, 58.27]
chords=[[0, 3, 7, 12], [0, 4, 7, 12]]
bass_steps=[0, 8]
bass_len=7.5
bass_bounce=false
pulse_every=16
hats_every=0
arp_every=2
lead=[[0, 74, 6], [8, 72, 4], [12, 69, 4], [16, 70, 6], [24, 69, 8]]
layers=["pulse", "bass", "arp", "lead"]

[shop]
roots=[65.406, 97.999]
chords=[[0, 4, 7, 12], [0, 4, 7, 10]]
bass_steps=[0, 4, 8, 12]
bass_len=1.6
bass_bounce=true
pulse_every=8
hats_every=4
arp_every=1
lead=[[0, 72, 2], [2, 76, 2], [4, 79, 2], [6, 76, 2], [8, 77, 4], [12, 76, 4], [16, 74, 2], [18, 77, 2], [20, 79, 2], [22, 77, 2], [24, 76, 6]]
layers=["pulse", "bass", "hats", "arp", "lead"]

[jingle_win]
notes=[[523.25, 0.0, 0.11, "square", 0.25, 0.2], [659.25, 0.12, 0.11, "square", 0.25, 0.2], [783.99, 0.24, 0.11, "square", 0.25, 0.2], [1046.5, 0.36, 0.6, "square", 0.25, 0.22], [659.25, 0.36, 0.6, "square", 0.125, 0.1], [783.99, 0.36, 0.6, "square", 0.125, 0.1], [130.81, 0.0, 0.34, "wave", 0.5, 0.4], [98.0, 0.12, 0.2, "wave", 0.5, 0.3], [130.81, 0.36, 0.6, "wave", 0.5, 0.45], [9000.0, 0.36, 0.06, "noise", 0.5, 0.15]]

[jingle_lose]
; The last long square note sags in pitch, like a sad trombone.
notes=[[392.0, 0.0, 0.24, "square", 0.5, 0.18], [369.99, 0.26, 0.24, "square", 0.5, 0.18], [349.23, 0.52, 0.24, "square", 0.5, 0.18], [329.63, 0.78, 0.75, "square", 0.5, 0.18], [130.81, 0.0, 0.76, "wave", 0.5, 0.4], [65.41, 0.78, 0.75, "wave", 0.5, 0.45]]
