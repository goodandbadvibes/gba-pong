; UPGRADES: picked at the start of a run and after every round won. They last the whole run.
; The opponent also gains one random upgrade per level (never LUCKY FIND).
;
; Each [section] is one upgrade. The section name (like flame) is its id: the game's code is
; wired to these ids, so rename the "name" line, not the [section].
;
;   name    title on the upgrade card
;   max     how many times it can be taken (its highest level)
;   color   card and icon color, "#rrggbb"
;   desc    card text, also your reference for what it does
;   icon    5x5 pixel icon, 5 rows of 0/1
;   other   numbers the effect uses; edit them to tune it ("per_level" means for each level taken)
;
; If you change a number, update the desc so the card still tells the truth.
; Text is shown in a 3x5 pixel font: use CAPITAL letters, digits and . , : - + ! / % ? ' ( ).

[flame]
name="FLAME BALL"
max=3
color="#f88020"
desc="BALLS YOU HIT CATCH FIRE. A BURNING HIT SHRINKS THE FOE PADDLE UNTIL THE BURN ENDS."
icon=["00100", "01100", "01110", "11111", "01110"]
; Share of the paddle a full burn takes away: base + per extra level, never more than max.
base_strength=0.3
strength_per_level=0.1
max_strength=0.8
; Burn time is BURN TIME SEC in the debug menu, plus this much per extra level.
extra_seconds_per_level=0.5

[slime]
name="SLIME BALL"
max=3
color="#78e848"
desc="BALLS YOU HIT TURN SLIMY. A SLIMY HIT SLOWS THE FOE PADDLE UNTIL IT WEARS OFF."
icon=["01110", "11111", "11111", "10101", "10101"]
; How much slower the slimed paddle gets: base + per extra level; it keeps at least min_speed.
base_slow=0.4
slow_per_level=0.1
min_speed=0.2
extra_seconds_per_level=0.5

[magnet]
name="MAGNET BALL"
max=3
color="#c8c8d8"
desc="BALLS YOU HIT PULL IN POWER UPS AND GEMS NEARBY."
icon=["11011", "11011", "10001", "10001", "01110"]
; Reach is MAGNET RANGE in the debug menu plus this per extra level (pixels).
reach_per_level=15.0
; Pull speed in pixels per second: base + per level.
pull_base=50.0
pull_per_level=30.0

[long]
name="LONG PADDLE"
max=4
color="#58d868"
desc="YOUR PADDLE IS 15% TALLER PER LEVEL."
icon=["01110", "00100", "00100", "00100", "01110"]
per_level=0.15

[power]
name="POWER HIT"
max=4
color="#f8d848"
desc="BALLS YOU HIT FLY 12% FASTER PER LEVEL."
icon=["10001", "01010", "11111", "01010", "10001"]
per_level=0.12

[lucky]
name="LUCKY FIND"
max=3
color="#e878e8"
desc="POWER UPS AND GEMS SHOW UP MORE OFTEN AND GEMS ARE WORTH MORE."
icon=["01010", "10101", "01110", "00100", "00100"]
; Power-ups and gem shards come this much more often per level (0.25 = 25%).
spawn_per_level=0.25
; Each gem shard is worth 1 plus this per level.
gem_bonus_per_level=1

[wingman]
name="WINGMAN"
max=3
color="#98b8f8"
desc="EVERY GAME STARTS WITH AN EXTRA PADDLE PER LEVEL THAT PATROLS ON ITS OWN."
icon=["10100", "10101", "10101", "10101", "00101"]

[venom]
name="VENOM BALL"
max=3
color="#b060f8"
desc="BALLS YOU HIT ARE POISONOUS. ENOUGH POISON LEAVES A PATCH ON THE FOE TRACK THAT SLOWS ITS PADDLE."
icon=["01110", "10101", "11111", "01110", "01010"]
; Poison added per poisonous hit: base + per level (level 1 = 2).
poison_base=1.0
poison_per_level=1.0

[overcharge]
name="OVERCHARGE"
max=3
color="#f8f878"
desc="EVERY GAME STARTS WITH A BOOSTER: ALL YOUR MODIFIERS HIT HARDER FOR 2 SEC PER LEVEL."
icon=["00110", "01100", "11111", "00110", "01100"]
seconds_per_level=2.0

[factory]
name="BALL FACTORY"
max=3
color="#e8e8e8"
desc="EVERY GAME STARTS WITH A BALL GENERATOR ON YOUR SIDE: 2 BALLS, +1 PER EXTRA LEVEL."
icon=["11111", "10101", "11111", "10001", "11111"]
; Balls are GENERATOR BALLS in the debug menu plus this per extra level.
extra_balls_per_level=1

[turret]
name="TURRET"
max=3
color="#f8c848"
desc="A TURRET PER LEVEL SPEEDS UP YOUR BALLS THAT PASS THROUGH IT. FOE BALLS DAMAGE IT. IT REBUILDS ITSELF."
icon=["00100", "01110", "11011", "01110", "00100"]
