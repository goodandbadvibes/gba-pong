; POWER-UPS: the pickups that appear mid-court during a round.
;
; Each [section] is one power-up. The section name (like fast_ball) is its id: the game's code
; is wired to these ids, so rename the "name" line, not the [section]. Adding a new section does
; not create a new power-up; removing one breaks it.
;
;   name    text shown when it is picked up (an ! is added)
;   color   box color, "#rrggbb"
;   icon    5x5 pixel icon, 5 rows of 0/1 (1 = pixel cut out of the colored box)
;   desc    what it does, in plain words (reference for you; also used in the README)
;   other   numbers the effect uses; edit them to tune that power-up
;
; How often each one appears is set in the debug menu (CHANCE rows), not here.
; Text is shown in a 3x5 pixel font: use CAPITAL letters, digits and . , : - + ! / % ? ' ( ).

[fast_ball]
name="FAST BALL"
color="#f8d848"
icon=["10100", "01010", "00101", "01010", "10100"]
desc="THE BALL THAT COLLECTS IT SPEEDS UP."
speed_mult=1.35

[multi_ball]
name="MULTI BALL"
color="#f8f8f8"
icon=["10001", "00000", "00100", "00000", "10001"]
desc="EXTRA BALLS SPLIT OFF THE BALL THAT COLLECTS IT, UP TO MAX BALLS."
extra_balls=2
; Angle between the original and each extra ball, in radians (0.35 is about 20 degrees).
spread=0.35

[big_paddle]
name="BIG PADDLE"
color="#58d868"
icon=["01110", "00100", "00100", "00100", "01110"]
desc="THE COLLECTOR'S PADDLE GROWS FOR A WHILE (EFFECT TIME IN THE DEBUG MENU)."
size_mult=1.5

[shrink_foe]
name="SHRINK FOE"
color="#f84848"
icon=["10001", "01010", "00100", "01010", "10001"]
desc="THE OTHER SIDE'S PADDLE SHRINKS FOR A WHILE."
size_mult=0.6

[slow_foe]
name="SLOW FOE"
color="#a868f8"
icon=["01010", "01010", "01010", "01010", "01010"]
desc="THE OTHER SIDE'S PADDLE MOVES SLOWER FOR A WHILE."
speed_mult=0.6

[wingman]
name="WINGMAN"
color="#98b8f8"
icon=["10100", "10101", "10101", "10101", "00101"]
desc="A ONE-OFF EXTRA PADDLE FOR THE COLLECTOR THAT PATROLS UP AND DOWN (HP AND SPEED IN THE DEBUG MENU)."

[turret]
name="TURRET"
color="#f8c848"
icon=["00100", "01110", "11011", "01110", "00100"]
desc="A ONE-OFF TURRET FOR THE COLLECTOR: SPEEDS UP ITS OWN BALLS, FOE BALLS DAMAGE IT, NOT REBUILT."

[poison]
name="POISON"
color="#b060f8"
icon=["01110", "10101", "11111", "01110", "01010"]
desc="ADDS POISON TO THE OTHER SIDE (POISON POWER UP AMOUNT IN THE DEBUG MENU)."

[booster]
name="BOOSTER"
color="#f8f878"
icon=["00110", "01100", "11111", "00110", "01100"]
desc="FOR A WHILE EVERYTHING THE COLLECTOR HAS WORKS HARDER (TIME AND STRENGTH IN THE DEBUG MENU)."

[generator]
name="GENERATOR"
color="#e8e8e8"
icon=["11111", "10101", "11111", "10001", "11111"]
desc="A BALL GENERATOR FOR THE COLLECTOR THAT LAUNCHES BALLS AT THE OTHER SIDE UNTIL EMPTY."
