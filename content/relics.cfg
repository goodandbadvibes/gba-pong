; RELICS: bought with gems in the shop that appears every few levels. Each can be owned once per
; run, and only the player has them.
;
; Each [section] is one relic. The section name (like hive) is its id: the game's code is wired
; to these ids, so rename the "name" line, not the [section].
;
;   name    title on the shop card
;   price   cost in gems (the debug menu's RELIC PRICE % scales all prices)
;   color   card and icon color, "#rrggbb"
;   desc    card text, also your reference for what it does
;   icon    5x5 pixel icon, 5 rows of 0/1
;   other   numbers the effect uses; edit them to tune it
;
; If you change a number, update the desc so the card still tells the truth.
; Text is shown in a 3x5 pixel font: use CAPITAL letters, digits and . , : - + ! / % ? ' ( ).

[hive]
name="HIVE MIND"
price=12
color="#f8c848"
desc="BALLS YOUR TURRETS SPEED UP ALSO GET YOUR FLAME, SLIME AND VENOM."
icon=["01110", "10101", "11111", "10101", "01110"]

